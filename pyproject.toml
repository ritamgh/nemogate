[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemogate"
version = "0.1.0"
description = "Tests whether rules survive agent handoffs in a Deep Agents system."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7.23",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "openai>=3.27.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
proof = ["contree-sdk==0.3.6"]
repair = []

[tool.hatch.build.targets.wheel]
packages = ["src/nemogate"]
exclude = ["**/tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "nemogate[proof,repair]",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "tavily-python>=0.8.5",
]
