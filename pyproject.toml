[project]
name = "nemogate"
version = "0.1.0"
description = "Tests whether rules survive agent handoffs in a Deep Agents system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
