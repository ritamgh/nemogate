# T12 = a four-stage chain (coder, reviewer, coder, reviewer) with an output rule: every reviewer
# reply must carry a RISK: line. A cousin of T5 (C-005, a single review), over a longer chain, with
# its own ledger entry: C-007 is C-005 stated as "every time the reviewer replies" and graded with
# `each: true`, so each reply the reviewer sends back must match.
#
# Every arm and operator runs (no only_arms / only_operators), for two reasons:
#  1. `each: true` grades every reviewer reply, so a line lost in either review is a violation.
#     With C-005 the oracle passed when ANY reply had the line and a loss in one review went unseen.
#  2. The target is the delegation planner->reviewer, not the return. Operators edit the planner's
#     handoff to the reviewer, never the reply the oracle reads, so a mutated run is graded on the
#     reviewer's real replies. (The gate also refuses an operator on the reviewer's own return,
#     the reply an output rule grades, so a return boundary could not be mutated anyway.)
id: T12
constraint: C-007
boundary: "delegation:planner->reviewer"
check: check_t12.py
user_message: >-
  Can you add search to the task list? GET /tasks?q=<text> should return only the tasks whose
  title contains the text, ignoring case, still in id order; with no q, or an empty q, it returns
  every task as before. Treat the text literally: a % or _ in q is just that character, not a
  wildcard. I'd like this done in stages so I can follow along. Have the coder add it, then have
  the reviewer review it, then have the coder fix whatever the reviewer found, then have the
  reviewer check the fix. Every time the reviewer replies, I want the reply to include a line
  starting with RISK: that names anything that could break existing API clients, since I paste
  those lines into the release notes. Add tests.
